# ============================================================================
# BASIC SETTINGS
# ============================================================================

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
# This won't conflict with your Neovim setup
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (very beginner-friendly)
set -g mouse on

# Start windows and panes at 1, not 0 (more intuitive)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when a window is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable 256 colors and true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# Reduce command delay (makes tmux more responsive)
set -sg escape-time 0

# Increase repeat time for repeatable commands
set -g repeat-time 1000

# ============================================================================
# KEY BINDINGS (Easy to remember!)
# ============================================================================

# Reload configuration file (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes with | and - (more intuitive than % and ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Create new window with current path
bind c new-window -c "#{pane_current_path}"

# Switch panes using Alt-arrow (no prefix needed!)
# These won't conflict with your Neovim Ctrl-hjkl bindings
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Shift-arrow (no prefix needed!)
bind -n S-Left previous-window
bind -n S-Right next-window

# Resize panes using Prefix + Arrow keys
bind Left resize-pane -L 5
bind Right resize-pane -R 5
bind Up resize-pane -U 5
bind Down resize-pane -D 5

# Quick pane switching with Prefix + hjkl (vim-style, but with prefix to avoid conflicts)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Kill pane without confirmation (Prefix + x)
bind x kill-pane

# Kill window without confirmation (Prefix + X)
bind X kill-window

# ============================================================================
# COPY MODE SETTINGS (Vim-like)
# ============================================================================

# Enter copy mode with Prefix + [
# Use vim keybindings in copy mode
setw -g mode-keys vi

# Copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Paste with Prefix + p
bind p paste-buffer

# ============================================================================
# STATUS BAR CONFIGURATION
# ============================================================================

# Enable status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Status bar colors (clean and modern)
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'

# Left side: session name
set -g status-left-length 20
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]'

# Right side: date and time
set -g status-right-length 50
set -g status-right '#[bg=#1e1e2e,fg=#f38ba8]#[bg=#f38ba8,fg=#1e1e2e,bold] %Y-%m-%d #[bg=#89b4fa,fg=#1e1e2e,bold] %H:%M '

# Window status format
set -g window-status-format '#[bg=#313244,fg=#cdd6f4] #I:#W '
set -g window-status-current-format '#[bg=#a6e3a1,fg=#1e1e2e,bold] #I:#W '

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Message styling
set -g message-style 'bg=#f38ba8,fg=#1e1e2e,bold'

# ============================================================================
# ADVANCED FEATURES
# ============================================================================

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity off

# Automatically set window title
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#T - #S:#I:#W'

# Don't exit tmux when last shell exits
set -g exit-unattached off

# Focus events enabled for terminals that support them
set -g focus-events on

# ============================================================================
# SESSION MANAGEMENT HELPERS
# ============================================================================

# Quick session switching (Prefix + s shows session list)
# Prefix + $ to rename session
# Prefix + d to detach from session

# Create new session with name (Prefix + :new -s session_name)
bind S command-prompt -p "New session name:" "new-session -s '%%'"


# Resize panes without prefix, Alt + Shift + Arrow keys (10 cells)
bind -n M-S-Left  resize-pane -L 10
bind -n M-S-Right resize-pane -R 10
bind -n M-S-Up    resize-pane -U 10
bind -n M-S-Down  resize-pane -D 10

